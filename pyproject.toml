[project]
name = "qlsocket-api"
version = "0.1.0"
description = ""
authors = [
    {name = "KiokuEien"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
python_files = ["test_*.py"]